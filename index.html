<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>CueVerse VR</title>
  <meta name="description" content="First-person, hand-tracked snooker in your own private club. Built for Meta Quest." />
  <style>
    html, body { margin: 0; height: 100%; background: #050302; overflow: hidden; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #f3ead6; }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
      background: radial-gradient(ellipse at 50% 30%, rgba(20,14,8,0.55), rgba(3,2,1,0.92)); transition: opacity 0.4s; }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .card { width: min(560px, 100%); padding: 36px 34px 28px; box-sizing: border-box; text-align: center; border: 1px solid #d9b65a; border-radius: 22px;
      background: linear-gradient(180deg, rgba(24,17,10,0.95), rgba(7,5,4,0.97)); box-shadow: 0 30px 80px rgba(0,0,0,0.7), inset 0 0 0 6px rgba(217,182,90,0.08); }
    h1 { margin: 0; font: 700 clamp(40px, 9vw, 64px)/1 Georgia, "Times New Roman", serif; letter-spacing: 0.08em; color: #d9b65a; }
    h1 span { font-size: 0.42em; letter-spacing: 0.3em; vertical-align: super; color: #f3ead6; }
    .tag { margin: 12px 0 26px; font: italic 400 18px Georgia, serif; opacity: 0.85; }
    label { display: block; margin-bottom: 8px; font-size: 13px; letter-spacing: 0.18em; opacity: 0.7; }
    input { width: 100%; box-sizing: border-box; padding: 13px 16px; font: 600 20px Georgia, serif; text-align: center; color: #f7efdc; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(217,182,90,0.5); border-radius: 12px; outline: none; }
    input:focus { border-color: #d9b65a; }
    .row { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
    button { flex: 1 1 200px; padding: 16px 14px; font: 700 18px "Segoe UI", Roboto, Arial, sans-serif; letter-spacing: 0.06em; border-radius: 14px; cursor: pointer; border: 1px solid #d9b65a; }
    #enterVR { color: #1a1206; background: linear-gradient(180deg, #f0d27a, #b58a2a); }
    #enterVR:disabled { opacity: 0.4; cursor: not-allowed; }
    #enterDesktop { color: #f3ead6; background: rgba(255,255,255,0.06); }
    #note { margin: 18px 0 0; font-size: 14px; line-height: 1.5; opacity: 0.75; min-height: 2.6em; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay">
    <div class="card">
      <h1>CUEVERSE <span>VR</span></h1>
      <p class="tag">Your club. Your table. Your cue.</p>
      <label for="clubName">NAME YOUR CLUB</label>
      <input id="clubName" maxlength="28" autocomplete="off" spellcheck="false" />
      <div class="row">
        <button id="enterVR" disabled>ENTER YOUR CLUB</button>
        <button id="enterDesktop">Desktop preview</button>
      </div>
      <p id="note">Checking for a headset&hellip;</p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
